# ==============================================================
# EMQX 5.4.1 â€” ConfiguraciÃ³n para flota de vehÃ­culos elÃ©ctricos
# NOTA: Sintaxis HOCON compatible con EMQX 5.x
# ==============================================================

# ====================== Nodo (campos obligatorios) ======================
node {
  data_dir = "/opt/emqx/data"
  # Cookie de seguridad para el cluster Erlang (nodo Ãºnico en dev/prod single-node)
  cookie = "ecomoviles-emqx-secret-cookie"
}

# ====================== Listeners ======================
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 10000
  acceptors = 16
}

listeners.ws.default {
  bind = "0.0.0.0:1884"
  max_connections = 5000
  acceptors = 8

  authentication = [
    {
      mechanism = jwt
      from = password
      use_jwks = true
      endpoint = "http://keycloak:9090/realms/realm-dev/protocol/openid-connect/certs"

      verify_claims = {
        iss = "http://keycloak:9090/realms/realm-dev"
        azp = "mqtt-public"
      }

      refresh_interval = 300
    }
  ]
}

listeners.wss.default {
  bind = "0.0.0.0:1885"
  max_connections = 5000
  acceptors = 8
  # Descomentar cuando se dispongan certificados TLS:
  # ssl_options {
  #   certfile = "/opt/emqx/etc/certs/cert.pem"
  #   keyfile  = "/opt/emqx/etc/certs/key.pem"
  # }
}

# ====================== AutenticaciÃ³n ======================
# Usa la base de datos interna (usuarios creados por emqx-init via REST API)
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
  }
]

# ====================== AutorizaciÃ³n (ACL) ======================
authorization {
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
  no_match = deny
  deny_action = disconnect
}

# ====================== MQTT ======================
mqtt {
  max_packet_size = 1MB
  max_inflight    = 128
}

# ====================== Dashboard y API REST ======================
dashboard {
  listeners.http {
    bind = 18083
  }
}



